<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Đăng ký - WebsiteStudy</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #fef3c7 0, #fffbeb 40%, #f9fafb 100%);
    }
    .auth-shell {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      background: #ffffff;
      border-radius: 18px;
      padding: 28px 32px;
      box-shadow: 0 20px 50px rgba(15, 23, 42, 0.16);
      border: 1px solid #fde68a;
    }
    .auth-logo {
      font-weight: 700;
      font-size: 22px;
      margin-bottom: 4px;
      color: #111827;
    }
    .auth-logo span {
      color: #f97316;
    }
    .auth-title {
      font-size: 20px;
      font-weight: 600;
      margin: 12px 0 6px;
    }
    .auth-sub {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 18px;
    }
    .auth-input {
      width: 100%;
      margin: 6px 0 12px;
      padding: 9px 11px;
      border-radius: 10px;
      border: 1px solid #d1d5db;
      font-size: 14px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .auth-input:focus {
      outline: none;
      border-color: #f97316;
      box-shadow: 0 0 0 1px #f9731633;
      background: #fffbeb;
    }
    .auth-msg {
      margin-top: 8px;
      font-size: 13px;
      min-height: 18px;
      color: #6b7280;
    }
    .auth-msg.error {
      color: #dc2626;
    }
    .auth-msg.success {
      color: #16a34a;
    }
    .btn-full {
      width: 100%;
      display: inline-block;
      text-align: center;
    }
    .row-2col {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .back-home {
      margin-top: 16px;
      font-size: 13px;
      text-align: center;
      color: #6b7280;
    }
    .back-home a {
      color: #f97316;
      text-decoration: none;
    }
    .back-home a:hover {
      text-decoration: underline;
    }
    .auth-link {
      color: #f97316;
      text-decoration: none;
    }
    .auth-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="auth-logo">Study<span>Video</span></div>
      <h1 class="auth-title">Tạo tài khoản học tập</h1>
      <p class="auth-sub">
        Đăng ký tài khoản miễn phí để lưu lại tiến độ học, bình luận và đánh giá video.
      </p>

      <form id="register-form">
        <label style="font-size:13px;color:#4b5563;">Họ và tên</label>
        <input
          type="text"
          id="reg-name"
          class="auth-input"
          placeholder="VD: Nguyễn Văn A"
        />

        <label style="font-size:13px;color:#4b5563;">Email</label>
        <input
          type="email"
          id="reg-email"
          class="auth-input"
          placeholder="Nhập email của bạn"
        />

        <div class="row-2col">
          <div>
            <label style="font-size:13px;color:#4b5563;">Mật khẩu</label>
            <input
              type="password"
              id="reg-password"
              class="auth-input"
              placeholder="Tối thiểu 6 ký tự"
            />
          </div>
          <div>
            <label style="font-size:13px;color:#4b5563;">Nhập lại</label>
            <input
              type="password"
              id="reg-password2"
              class="auth-input"
              placeholder="Nhập lại mật khẩu"
            />
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-full" style="margin-top:8px;">
          Đăng ký
        </button>
      </form>

      <p id="register-msg" class="auth-msg"></p>

      <div style="border-top:1px dashed #fee2e2;margin:14px 0 10px;"></div>

      <p style="font-size:13px;color:#4b5563;">
        Đã có tài khoản?
        <a href="login.html" class="auth-link">Đăng nhập ngay</a>
      </p>

      <div class="back-home">
        <span>←</span>
        <a href="index.html">Quay về trang chủ</a>
      </div>
    </div>
  </div>

  <script>
    // Nếu đã đăng nhập rồi thì không cần vào trang đăng ký nữa
    document.addEventListener("DOMContentLoaded", () => {
      const token = localStorage.getItem("token");
      if (token) {
        window.location.href = "index.html";
        return;
      }
    });

    const regForm = document.getElementById("register-form");
    const regMsg = document.getElementById("register-msg");

    function setRegMsg(text, type = "") {
      regMsg.textContent = text || "";
      regMsg.className = "auth-msg";
      if (type) regMsg.classList.add(type);
    }

    regForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const name = document.getElementById("reg-name").value.trim();
      const email = document.getElementById("reg-email").value.trim();
      const password = document.getElementById("reg-password").value.trim();
      const password2 = document.getElementById("reg-password2").value.trim();

      if (!name || !email || !password || !password2) {
        setRegMsg("Vui lòng nhập đầy đủ Họ tên, Email và Mật khẩu.", "error");
        return;
      }
      if (password.length < 6) {
        setRegMsg("Mật khẩu nên có ít nhất 6 ký tự.", "error");
        return;
      }
      if (password !== password2) {
        setRegMsg("Mật khẩu nhập lại không khớp.", "error");
        return;
      }

      try {
        const res = await fetch("/api/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, email, password }),
        });

        const data = await res.json();

        if (!res.ok) {
          setRegMsg(data.message || "Đăng ký thất bại.", "error");
        } else {
          setRegMsg(
            "Đăng ký thành công! Đang chuyển sang trang đăng nhập...",
            "success"
          );
          regForm.reset();
          setTimeout(() => {
            window.location.href = "login.html";
          }, 1200);
        }
      } catch (err) {
        console.error(err);
        setRegMsg("Lỗi kết nối tới server.", "error");
      }
    });
  </script>
</body>
</html>
